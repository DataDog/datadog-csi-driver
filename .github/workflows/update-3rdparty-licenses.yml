name: Update 3rd-party licenses

on:
  pull_request:
    branches:
      - main
    paths:
      - 'go.sum'

jobs:
  update-3rdparty-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      DD_LICENSE_ATTRIBUTION_REF: 58e29701db6c72889f9298ff59717987404659c8
    steps:
      - name: Check out PR branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14'

      - name: Check out dd-license-attribution
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: DataDog/dd-license-attribution
          ref: ${{ env.DD_LICENSE_ATTRIBUTION_REF }}
          path: dd-license-attribution

      - name: Install dd-license-attribution
        working-directory: dd-license-attribution
        run: |
          pip install .

      - name: Create mirrors.json for PR branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cat > mirrors.json <<EOF
          [
            {
              "original_url": "${REPOSITORY_URL}",
              "mirror_url": "${REPOSITORY_URL}",
              "ref_mapping": {
                "branch:${DEFAULT_BRANCH}": "branch:${HEAD_REF}"
              }
            }
          ]
          EOF

      - name: Regenerate LICENSE-3rdparty.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dd-license-attribution generate-sbom-csv \
            --use-mirrors=mirrors.json \
            --no-scancode-strategy \
            --no-github-sbom-strategy \
            "${REPOSITORY_URL}" > LICENSE-3rdparty.csv

      - name: Run LICENSE-3rdparty.csv update check
        env:
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e

          if git diff --ignore-space-at-eol --exit-code LICENSE-3rdparty.csv; then
            echo "✅ LICENSE-3rdparty.csv is already up to date"
          else
            echo "📝 LICENSE-3rdparty.csv was modified by license attribution command"

            if [[ "$PR_USER_TYPE" == "Bot" ]] && [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "🤖 Bot-created PR detected. Auto-committing LICENSE-3rdparty.csv changes..."

              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"

              git add LICENSE-3rdparty.csv
              git commit -m "Update LICENSE-3rdparty.csv"

              git push origin HEAD:${GITHUB_HEAD_REF}

              echo "✅ Successfully committed and pushed LICENSE-3rdparty.csv updates"
            else
              echo "❌ The LICENSE-3rdparty.csv file needs to be updated!"
              echo ""
              echo "The license attribution command has modified LICENSE-3rdparty.csv."
              echo ""
              echo "To fix this issue:"
              echo ""
              echo "1. Install the SAME pinned version of dd-license-attribution that CI uses"
              echo "   (newer versions may produce different output and will not match this check):"
              echo "   pip install git+https://github.com/DataDog/dd-license-attribution@${DD_LICENSE_ATTRIBUTION_REF}"
              echo ""
              echo "2. Export a VALID GitHub token. The tool resolves dependencies through the"
              echo "   GitHub API, and an expired or revoked token does NOT fail loudly: it"
              echo "   silently produces a near-empty CSV holding only the root component."
              echo "   Note that 'gh auth token' returns \$GITHUB_TOKEN when that is already"
              echo "   set, so a stale exported value hides the valid one in your keyring:"
              echo "     export GITHUB_TOKEN=\"\$(env -u GITHUB_TOKEN -u GH_TOKEN gh auth token)\""
              echo "   Verify it before generating (must print 200):"
              echo "     curl -s -o /dev/null -w '%{http_code}\\n' \\"
              echo "       -H \"Authorization: Bearer \$GITHUB_TOKEN\" \\"
              echo "       https://api.github.com/repos/${GITHUB_REPOSITORY}"
              echo ""
              echo "3. Generate on LINUX. The dependency set is resolved for the host platform,"
              echo "   so a macOS run omits Linux-only modules (for example"
              echo "   github.com/prometheus/procfs) and will never match this check."
              echo ""
              echo "4. Point the tool at YOUR branch. CI remaps the default branch to the PR"
              echo "   branch via --use-mirrors; without this you generate the CSV for"
              echo "   '${DEFAULT_BRANCH}' instead of your branch. Write mirrors.json:"
              echo "     ["
              echo "       {"
              echo "         \"original_url\": \"${REPOSITORY_URL}\","
              echo "         \"mirror_url\": \"${REPOSITORY_URL}\","
              echo "         \"ref_mapping\": {"
              echo "           \"branch:${DEFAULT_BRANCH}\": \"branch:${GITHUB_HEAD_REF}\""
              echo "         }"
              echo "       }"
              echo "     ]"
              echo ""
              echo "5. Run the license CSV generation command locally:"
              echo "   dd-license-attribution generate-sbom-csv \\"
              echo "     --use-mirrors=mirrors.json \\"
              echo "     --no-scancode-strategy \\"
              echo "     --no-github-sbom-strategy \\"
              echo "     ${REPOSITORY_URL} > LICENSE-3rdparty.csv"
              echo ""
              echo "6. Commit the updated LICENSE-3rdparty.csv file"
              echo "7. Push your changes"
              echo ""
              echo "This helps keep the 3rd-party license information accurate."
              exit 1
            fi
          fi
