name: Update 3rd-party licenses

on:
  pull_request:
    branches:
      - main
    paths:
      - 'go.sum'

jobs:
  update-3rdparty-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      DD_LICENSE_ATTRIBUTION_REF: 58e29701db6c72889f9298ff59717987404659c8
    steps:
      - name: Check out PR branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14'

      - name: Check out dd-license-attribution
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: DataDog/dd-license-attribution
          ref: ${{ env.DD_LICENSE_ATTRIBUTION_REF }}
          path: dd-license-attribution

      - name: Install dd-license-attribution
        working-directory: dd-license-attribution
        run: |
          pip install .

      - name: Create mirrors.json for PR branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cat > mirrors.json <<EOF
          [
            {
              "original_url": "${REPOSITORY_URL}",
              "mirror_url": "${REPOSITORY_URL}",
              "ref_mapping": {
                "branch:${DEFAULT_BRANCH}": "branch:${HEAD_REF}"
              }
            }
          ]
          EOF

      - name: Regenerate LICENSE-3rdparty.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dd-license-attribution generate-sbom-csv \
            --use-mirrors=mirrors.json \
            --no-scancode-strategy \
            --no-github-sbom-strategy \
            "${REPOSITORY_URL}" > LICENSE-3rdparty.csv

      - name: Run LICENSE-3rdparty.csv update check
        env:
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          if git diff --ignore-space-at-eol --exit-code LICENSE-3rdparty.csv; then
            echo "✅ LICENSE-3rdparty.csv is already up to date"
          else
            echo "📝 LICENSE-3rdparty.csv was modified by license attribution command"

            if [[ "$PR_USER_TYPE" == "Bot" ]] && [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "🤖 Bot-created PR detected. Auto-committing LICENSE-3rdparty.csv changes..."

              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"

              git add LICENSE-3rdparty.csv
              git commit -m "Update LICENSE-3rdparty.csv"

              git push origin HEAD:${GITHUB_HEAD_REF}

              echo "✅ Successfully committed and pushed LICENSE-3rdparty.csv updates"
            else
              echo "❌ LICENSE-3rdparty.csv is out of date. The diff above is what changed."
              echo ""
              echo "Fix: download the 'LICENSE-3rdparty.csv' artifact from this workflow run,"
              echo "replace the file in your branch with it, then commit and push."
              echo ""
              echo "  gh run download ${GITHUB_RUN_ID} -n LICENSE-3rdparty.csv -R ${GITHUB_REPOSITORY}"
              echo ""
              echo "To regenerate it yourself instead, run on Linux with a valid GitHub token:"
              echo ""
              echo "  pip install git+https://github.com/DataDog/dd-license-attribution@${DD_LICENSE_ATTRIBUTION_REF}"
              echo "  printf '[{\"original_url\":\"%s\",\"mirror_url\":\"%s\",\"ref_mapping\":{\"branch:%s\":\"branch:%s\"}}]' \\"
              echo "    '${REPOSITORY_URL}' '${REPOSITORY_URL}' '${DEFAULT_BRANCH}' '${GITHUB_HEAD_REF}' > mirrors.json"
              echo "  dd-license-attribution generate-sbom-csv --use-mirrors=mirrors.json \\"
              echo "    --no-scancode-strategy --no-github-sbom-strategy \\"
              echo "    ${REPOSITORY_URL} > LICENSE-3rdparty.csv"
              echo ""
              echo "Caveats, each of which silently produces a wrong file rather than an error:"
              echo "  - An expired token yields a CSV with only the root component. Check with:"
              echo "      curl -so /dev/null -w '%{http_code}\\n' -H \"Authorization: Bearer \$GITHUB_TOKEN\" \\"
              echo "        https://api.github.com/repos/${GITHUB_REPOSITORY}"
              echo "    'gh auth token' echoes \$GITHUB_TOKEN when set, so unset it first if stale."
              echo "  - Dependencies resolve per host platform: macOS drops Linux-only modules."
              echo "  - Without --use-mirrors you generate for '${DEFAULT_BRANCH}', not your branch."
              exit 1
            fi
          fi

      - name: Upload regenerated LICENSE-3rdparty.csv
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LICENSE-3rdparty.csv
          path: LICENSE-3rdparty.csv
